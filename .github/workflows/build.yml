name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          echo "=== Available Xcode versions ==="
          ls /Applications | grep -i xcode || true
          # Pin to Xcode 16.2 for reproducible builds.
          # If unavailable, fall back to the runner default and report it.
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
            echo "Pinned to Xcode 16.2"
          else
            echo "Xcode 16.2 not found — using runner default"
          fi
          echo "=== Active Xcode ==="
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen if needed
        run: |
          if ! command -v xcodegen &> /dev/null; then
            echo "Installing XcodeGen via Homebrew..."
            brew install xcodegen
          fi
          echo "XcodeGen version:"
          xcodegen version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (iOS Simulator)
        run: |
          set -o pipefail
          xcodebuild \
            -project PlainLog.xcodeproj \
            -scheme PlainLog \
            -destination 'generic/platform=iOS Simulator' \
            -quiet \
            build 2>&1 | tail -30

      - name: Run unit tests
        run: |
          set -o pipefail
          # `xcodebuild build` above only compiles the app target (per the
          # scheme's `build` action). It never compiles or runs PlainLogTests,
          # so we need an explicit `test` action against a concrete simulator
          # (generic/platform destinations can build but cannot run tests).
          # Runner simulator availability shifts between Xcode/OS images, so
          # pick an available iPhone simulator at run time rather than
          # hardcoding a device name that may not exist on this runner.
          DEVICE_UDID=$(xcrun simctl list devices available -j | jq -r '
            .devices
            | to_entries
            | map(.value)
            | flatten
            | map(select(.name | test("iPhone")))
            | .[0].udid // empty
          ')

          if [ -z "$DEVICE_UDID" ]; then
            echo "::error::No available iPhone simulator found on this runner."
            xcrun simctl list devices available
            exit 1
          fi

          echo "Using simulator UDID: $DEVICE_UDID"

          xcodebuild \
            -project PlainLog.xcodeproj \
            -scheme PlainLog \
            -destination "platform=iOS Simulator,id=$DEVICE_UDID" \
            test 2>&1 | tail -60

      - name: Verify targets
        run: xcodebuild -project PlainLog.xcodeproj -list
