name: PlainLog
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PlainLog:
    type: application
    platform: iOS
    sources:
      - path: PlainLog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.plainlog.ios
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PlainLog
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
  PlainLogTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PlainLogTests
      # SKTestSession(configurationFileNamed:) resolves the .storekit file
      # from the TEST bundle's own resources, not the app target's — CI run
      # 33113378482 showed Product.products(for:) returning zero results
      # (SKTestSession itself never threw) with the file only in PlainLog's
      # bundle. Adding it here as its own source entry copies it into
      # PlainLogTests's bundle too, without duplicating BillingKit.swift's
      # compiled sources into this target.
      - path: PlainLog/Core/Billing/PlainLogProducts.storekit
    dependencies:
      - target: PlainLog
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.plainlog.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PlainLog.app/PlainLog"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  PlainLog:
    build:
      targets:
        PlainLog: all
    test:
      targets:
        - PlainLogTests
